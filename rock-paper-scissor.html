<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="rock-paper-scissor.css">
    </head>
    <body>
        <p class="title">Rock Paper Scissors Game!!!</p>
        <button class="rock-button" onclick="gamemoves('rock')"><img  class="rock-image"    src="rock.jpg"></button>
        <button class="paper-button" onclick="gamemoves('paper')"><img class="paper-image"   src="paper.jpg"></button>
        <button class="scissors-button" onclick="gamemoves('scissors')"><img class="scissors-image"   src="scissors.jpg"></button>
        <p class="moves"></p>
        <p class="result"></p>
        <p class="scores"></p>
        <button class="reset-button" onclick="resetscore()">Reset Score</button>
        <button class="auto-play-button" onclick="playAuto()
        if(document.querySelector('.auto-play-button').innerHTML=='Auto Play')
        {
            document.querySelector('.auto-play-button').innerHTML=' Stop Playing';
        }
        else{
            document.querySelector('.auto-play-button').innerHTML='Auto Play';
        }"
        >Auto Play</button>
    </body>

    <script src="rock-paper-scissor.js">
    </script>
</html>
